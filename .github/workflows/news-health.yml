name: Check news freshness
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-weekly-library.mjs
      - run: node scripts/check-news-freshness.mjs
