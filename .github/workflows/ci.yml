name: Validate website changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run lint && npm run test:unit
      - run: npm run news:weekly:library && npm run test:news:render
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
